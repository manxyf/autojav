name: Auto Sync Domain

on:
  schedule:
    # 每天北京时间晚上 10:00 自动运行一次 (14:00 UTC)
    - cron: '0 14 * * *'
  workflow_dispatch:     # 支持手动点击测试运行

jobs:
  build_and_run:
    runs-on: ubuntu-latest
    steps:
    - name: 步骤1 - 检出代码
      uses: actions/checkout@v4  # 升级至最新兼容的 v4 版本

    - name: 步骤2 - 配置 Python 环境
      uses: actions/setup-python@v5  # 升级至适配 Node 24 的 v5 版本

    - name: 步骤3 - 执行抓取脚本
      env:
        # 将系统自带的密钥传递给 Python，用于解除 API 调用频率限制
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python update.py

    - name: 步骤4 - 提交抓取到的新域名与脚本
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Action"
        git add domain.txt script.user.js
        if git diff --cached --quiet; then
          echo "一切无变化，无需更新"
        else
          git commit -m "自动同步最新域名与油猴脚本"
          git push
        fi
